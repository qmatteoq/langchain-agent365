[project]
name = "sample-langchain-agent"
version = "0.1.0"
description = "Sample LangChain agent using Microsoft Agent 365 SDK"
authors = [
    { name = "Microsoft", email = "support@microsoft.com" }
]
dependencies = [
    # LangChain orchestrator
    "langchain>=1.3.9",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.2.2",

    # Microsoft Agents SDK - Official packages for hosting and integration
    "microsoft-agents-hosting-aiohttp",
    "microsoft-agents-hosting-core",
    "microsoft-agents-authentication-msal",
    "microsoft-agents-activity",

    # Azure SDK components
    "azure-identity",

    # Core dependencies
    "python-dotenv",
    "aiohttp",

    # HTTP server support for MCP servers
    "uvicorn[standard]>=0.20.0",
    "fastapi>=0.100.0",

    # HTTP client
    "httpx>=0.24.0",

    # Data validation
    "pydantic>=2.0.0",

    # Additional utilities
    "typing-extensions>=4.0.0",

    # Microsoft Agent 365 SDK packages
    "microsoft-agents-a365-tooling @ git+https://github.com/microsoft/Agent365-python.git@c9af672f9958508a16a9d42e7c736f1b86e7fae2#subdirectory=libraries/microsoft-agents-a365-tooling",
    "microsoft-agents-a365-observability-core @ git+https://github.com/microsoft/Agent365-python.git@c9af672f9958508a16a9d42e7c736f1b86e7fae2#subdirectory=libraries/microsoft-agents-a365-observability-core",
    "microsoft-agents-a365-runtime @ git+https://github.com/microsoft/Agent365-python.git@c9af672f9958508a16a9d42e7c736f1b86e7fae2#subdirectory=libraries/microsoft-agents-a365-runtime",
    "microsoft-agents-a365-notifications @ git+https://github.com/microsoft/Agent365-python.git@c9af672f9958508a16a9d42e7c736f1b86e7fae2#subdirectory=libraries/microsoft-agents-a365-notifications",

    # Agent 365 LangChain observability extension
    "microsoft-agents-a365-observability-extensions-langchain @ git+https://github.com/microsoft/Agent365-python.git@c9af672f9958508a16a9d42e7c736f1b86e7fae2#subdirectory=libraries/microsoft-agents-a365-observability-extensions-langchain"
]
requires-python = ">=3.11"

# Package index configuration
# PyPI is the default/primary source, local packages are fallback
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# Allow pre-release versions for Microsoft Agent 365 SDK packages
# This ensures we always get the latest features and fixes
[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "aiohttp",
    "aiohttp.*",
    "azure",
    "azure.*",
    "langchain",
    "langchain.*",
    "langchain_core",
    "langchain_core.*",
    "langchain_mcp_adapters",
    "langchain_mcp_adapters.*",
    "langchain_openai",
    "langchain_openai.*",
    "microsoft_agents",
    "microsoft_agents.*",
    "microsoft_agents_a365",
    "microsoft_agents_a365.*",
]
ignore_missing_imports = true
